name = "node-group-ai-form-handler"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://albrightlaboratories.github.io"
RATE_LIMIT_MAX = 5
RATE_LIMIT_WINDOW_SECONDS = 60

# Cloudflare KV for waitlist storage
[[kv_namespaces]]
binding = "WAITLIST_KV"
id = "e9866fd880534e9e896bcf3eb5b0971b"
